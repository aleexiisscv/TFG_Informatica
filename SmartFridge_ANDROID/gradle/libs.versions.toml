[versions]
agp = "8.7.3"
gson = "2.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
orgEclipsePahoAndroidService = "1.1.1"
orgEclipsePahoClientMqttv3 = "1.2.5"
# Bumped de 4.9.0 a 4.12.0: es la versión mínima que trae Retrofit 3.0.0
# como dependencia transitiva. Fijarla explícitamente evita que Gradle
# tenga que resolver dos versiones distintas de OkHttp en el grafo de
# dependencias.
okhttp = "4.12.0"
retrofit = "3.0.0"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
org-eclipse-paho-android-service = { module = "org.eclipse.paho:org.eclipse.paho.android.service", version.ref = "orgEclipsePahoAndroidService" }
org-eclipse-paho-client-mqttv3 = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "orgEclipsePahoClientMqttv3" }
# --- Nuevo en la Fase 5: cliente HTTP tipado para consumir el backend Spring Boot ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

# ------------------------------------------------------------------
# RETIRADO en esta iteración (dead code / anti-patrón de seguridad):
# mysql-connector-java, mariadb-java-client, hikaricp, jakarta-servlet-api,
# jetty-server, naming, glassy-jndi. Ninguna de las Activities activas del
# paquete com.example.smartfridge las usa ya (el código que las
# referenciaba —Android.Logic.*, Android.db.ConnectionDB— está muerto o
# comentado). Su sola presencia implicaba que el APK llevaba, en teoría,
# todo lo necesario para conectarse DIRECTAMENTE a la base de datos desde
# el teléfono: credenciales embebidas, sin pasar por ninguna validación
# de negocio. Si al recompilar ves un error de "cannot find symbol" en
# algún archivo que no hemos tocado en esta fase, es señal de que ese
# archivo SÍ dependía de alguna de estas librerías — antes de volver a
# añadirlas, revisa si ese archivo también debería migrarse a Retrofit.
# ------------------------------------------------------------------
