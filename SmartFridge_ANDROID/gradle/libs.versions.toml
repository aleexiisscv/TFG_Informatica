[versions]
agp = "8.7.3"
gson = "2.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
# --- Subidas en la Fase de rediseño UI ---
# appcompat 1.7.0: version alineada con compileSdk 34.
appcompat = "1.7.0"
# material 1.12.0: es la PRIMERA version que expone los roles de
# superficie de Material 3 (colorSurfaceContainer, ...ContainerHigh,
# ...ContainerHighest). El nuevo tema los usa para construir la
# jerarquia por tono en lugar de por sombra, asi que bajar de 1.12.0
# rompe themes.xml con "resource attr not found".
material = "1.12.0"
activity = "1.9.3"
fragment = "1.8.5"
# navigation 2.7.7: ultima linea 2.7.x, compatible con AGP 8.7 y
# compileSdk 34, y sin exigir Kotlin en un proyecto Java.
navigation = "2.7.7"
recyclerview = "1.3.2"
swiperefresh = "1.1.0"
constraintlayout = "2.1.4"
coordinatorlayout = "1.2.0"
# lottie 6.x: soporta minSdk 21 y trae el failure listener que usa
# AsistenteFragment para caer al avatar vectorial si el JSON falla.
lottie = "6.4.0"
# --- Nuevo en la Fase 11 (asistente RAG) ---
# lifecycle 2.8.7: ViewModel + LiveData. Es lo que permite que la
# conversacion y la peticion en vuelo sobrevivan a una rotacion de
# pantalla, algo que con el estado dentro del Fragment se perdia.
lifecycle = "2.8.7"
# markwon 4.6.2: render de Markdown a Spanned nativo. El asistente
# responde en Markdown porque su contenido tipico son recetas (pasos
# numerados, listas de ingredientes, negritas).
markwon = "4.6.2"
# --- Nuevo en la Fase 12 ---
# exifinterface: lee la orientacion que el movil anota en los metadatos
# de la foto. Sin aplicarla, el modelo de vision recibe el producto
# tumbado, que es justo lo que peor reconoce.
exifinterface = "1.3.7"
orgEclipsePahoAndroidService = "1.1.1"
orgEclipsePahoClientMqttv3 = "1.2.5"
# Bumped de 4.9.0 a 4.12.0: es la version minima que trae Retrofit 3.0.0
# como dependencia transitiva. Fijarla explicitamente evita que Gradle
# tenga que resolver dos versiones distintas de OkHttp en el grafo de
# dependencias.
okhttp = "4.12.0"
retrofit = "3.0.0"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
org-eclipse-paho-android-service = { module = "org.eclipse.paho:org.eclipse.paho.android.service", version.ref = "orgEclipsePahoAndroidService" }
org-eclipse-paho-client-mqttv3 = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "orgEclipsePahoClientMqttv3" }
# --- Fase 5: cliente HTTP tipado para consumir el backend Spring Boot ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
# --- Fase de rediseño UI: navegacion, listas y animacion ---
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefresh" }
coordinatorlayout = { group = "androidx.coordinatorlayout", name = "coordinatorlayout", version.ref = "coordinatorlayout" }
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }
# --- Fase 11: asistente conversacional ---
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
# --- Fase 12: accesibilidad y chat multimodal ---
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

# ------------------------------------------------------------------
# RETIRADO en la Fase 5 (dead code / anti-patron de seguridad):
# mysql-connector-java, mariadb-java-client, hikaricp, jakarta-servlet-api,
# jetty-server, naming, glassy-jndi. Ninguna de las Activities activas del
# paquete com.example.smartfridge las usa ya. Su sola presencia implicaba
# que el APK llevaba, en teoria, todo lo necesario para conectarse
# DIRECTAMENTE a la base de datos desde el telefono: credenciales
# embebidas, sin pasar por ninguna validacion de negocio.
#
# NOTA de la Fase de rediseño UI: las dependencias de Paho MQTT se
# mantienen pero SIGUEN SIN USARSE desde la app. El unico consumidor
# potencial era el switch de modo INSERTAR/ELIMINAR del dashboard, que
# se ha eliminado por no estar conectado a nada. Recomendacion: si no se
# decide publicar en frigorifico/modo desde el movil, retirarlas tambien
# (ahorran ~200 KB de APK y una dependencia sin mantenimiento activo
# desde 2019).
# ------------------------------------------------------------------
