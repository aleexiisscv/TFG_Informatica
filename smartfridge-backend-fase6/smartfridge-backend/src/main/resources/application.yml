spring:
  application:
    name: smartfridge-backend

  datasource:
    # ------------------------------------------------------------------
    # SUPABASE — elegido como proveedor cloud para esta iteración.
    #
    # Supabase expone tres formas de conectar a Postgres; solo una es
    # apta para un despliegue normal (Railway/Render/tu propia máquina)
    # sin soporte IPv6:
    #
    #   1) Conexión directa  db.<project-ref>.supabase.co:5432
    #      -> SOLO IPv6 en el plan gratuito. Descartada.
    #   2) Supavisor "Transaction pooler" (puerto 6543)
    #      -> Pooling real, pero PgBouncer en modo transacción NO es
    #         compatible con los prepared statements de servidor que usa
    #         Hibernate por defecto; obligaría a añadir
    #         "?prepareThreshold=0" y renunciar a esa caché.
    #   3) Supavisor "Session pooler" (puerto 5432)  <-- LA QUE USAMOS
    #      -> Mapeo 1:1 cliente-conexión (igual que Postgres nativo),
    #         100% compatible con Hibernate sin tocar nada, y soporta
    #         IPv4. Para el volumen de conexiones de un TFG (1 backend,
    #         tráfico bajo) es la opción más simple y menos propensa a
    #         errores difíciles de depurar. La Transaction pooler queda
    #         documentada como mejora de escalabilidad futura en la
    #         memoria si se necesitase soportar muchas instancias del
    #         backend en paralelo.
    #
    # Host y project-ref se obtienen en Supabase > Project Settings >
    # Database > Connection string > "Session pooler".
    # Formato: aws-0-<region>.pooler.supabase.com
    # Usuario: postgres.<project-ref>  (OJO: no es solo "postgres")
    # ------------------------------------------------------------------
    url: jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
    username: postgres.jsjvttmnyaespebtfvyl
    password: ubicua2026_
  jpa:
    hibernate:
      # "update" solo en desarrollo local. En despliegues reales se recomienda
      # "validate" + migraciones versionadas (Flyway) para no perder el
      # control del esquema como pasó con la BBDD original.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false   # Evita el anti-patrón Open Session In View en una API REST

server:
  port: 8081

# Parámetros propios de la integración MQTT (leídos por MqttConfig en la fase 3)
smartfridge:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: smartfridge-backend
    username: ${MQTT_USERNAME:ubicua}
    password: ${MQTT_PASSWORD:ubicua}
    base-topic: frigorifico/#
  gemini:
    # Clave de API de Google AI Studio (https://aistudio.google.com/apikey).
    # NUNCA se hardcodea: se resuelve en tiempo de arranque desde la
    # variable de entorno GEMINI_API_KEY (mismo patrón que ya usan
    # MQTT_USERNAME/MQTT_PASSWORD unas líneas más arriba en este mismo
    # archivo), de modo que la clave real nunca llega a versionarse en Git.
    api-key: ${GEMINI_API_KEY:AQ.Ab8RN6IIawWhMd1EhRjZ3I2A0uAm1ni7OFJC_BzZUNNqJilSPQ}

    # Modelo principal: la Fase 9 requiere máxima velocidad + capacidad
    # multimodal (imagen), ya que la latencia se suma al tiempo que el
    # usuario tiene la puerta del frigorífico abierta.
    model: ${GEMINI_MODEL:gemini-3.6-flash}

    # Modelo de respaldo: si el modelo principal no está habilitado en la
    # cuenta/región (cuota, deprecación, límite regional), VisionServiceImpl
    # reintenta automáticamente con este modelo antes de fallar la petición.
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-2.5-flash}

    api-base-url: ${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

  # ------------------------------------------------------------------
  # ASISTENTE CONVERSACIONAL (Fase 11)
  #
  # Parámetros de comportamiento del agente RAG. Van aparte de
  # "gemini" a propósito: aquello es "cómo conectar con Google"
  # (clave, modelo, URL) y esto es "cómo debe comportarse nuestro
  # asistente". Ajustar la longitud de una respuesta no debería
  # obligar a tocar la configuración de conexión.
  # ------------------------------------------------------------------
  asistente:
    # 0.0 sería determinista (bien para clasificar imágenes, robótico
    # para conversar). Por encima de ~0.9 empiezan las alucinaciones,
    # que es justo lo que el contexto inyectado intenta evitar.
    temperature: ${ASISTENTE_TEMPERATURE:0.6}

    # Presupuesto TOTAL de salida. Generoso porque los modelos
    # "thinking" descuentan de aquí su razonamiento interno ANTES de
    # escribir una sola palabra: quedarse corto no trunca la
    # respuesta, devuelve un candidato VACÍO con
    # finishReason=MAX_TOKENS (el bug depurado en la Fase 9). Una
    # receta paso a paso ocupa fácilmente 400-600 tokens.
    max-output-tokens: ${ASISTENTE_MAX_OUTPUT_TOKENS:2048}

    # Turnos anteriores que se reenvían a Gemini en cada petición.
    # Acota tamaño de prompt, coste y latencia: el contexto del
    # frigorífico ya ocupa lo suyo y se reinyecta entero cada vez.
    max-turnos-historial: ${ASISTENTE_MAX_TURNOS:10}

    # Recorte por turno del historial, para que un mensaje muy largo
    # (una receta completa devuelta hace cinco turnos) no se coma el
    # presupuesto de los siguientes.
    max-caracteres-turno: ${ASISTENTE_MAX_CARACTERES_TURNO:1500}

logging:
  level:
    # El cliente HTTP de Gemini se extrajo de VisionServiceImpl a
    # GeminiClient en la Fase 11: es esa clase la que ahora vuelca el
    # JSON de petición y respuesta. Con este nivel se ve el prompt
    # completo (contexto inyectado incluido) y el finishReason real.
    com.smartfridge.gemini.GeminiClient: DEBUG
    # Muestra el resumen del contexto capturado en cada turno.
    com.smartfridge.service.ContextoFrigorificoServiceImpl: DEBUG